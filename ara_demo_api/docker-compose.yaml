services:
  postgres:
    image: postgres:15-alpine
    container_name: ara_demo_postgres
    environment:
      POSTGRES_USER: ara_user
      POSTGRES_PASSWORD: changeme123
      POSTGRES_DB: ara_demo
    ports:
      - "5454:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - ara_demo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ara_user -d ara_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    
  redis:
    image: redis:7-alpine
    container_name: ara_demo_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-myredissecret}
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - ara_demo_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: ara-demo
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - ./data/minio:/data
    networks:
      - ara_demo_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  ara_demo_network:
    driver: bridge
    name: ara_demo_network
    